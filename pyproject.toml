[project]
name = "anima"
version = "0.1.0"
description = "Local-first RP system: characters that remember, learn, and evolve (Django + ChromaDB)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
    "celery>=5.3",
    "django-celery-beat>=2.6",
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "gunicorn>=22.0",
    "whitenoise>=6.6",
]

[dependency-groups]
# PEP 735: keine Extras. Aufräumen: `uv sync --group dev`
# (oder `uv pip install -e .` + die Gruppe explizit nachinstallieren).
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "django-stubs>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Webanwendung: Django-App-Struktur bleibt bewusst src-layout-frei
# (Python-Projektleitlinie §2 erlaubt das für Framework-Strukturen).
packages = [
    "anima",
    "anima_sessions",
    "characters",
    "relationships",
    "scenarios",
    "web",
    "worlds",
    "memory",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "anima.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "--cov --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
# Anwendung (kein striktes Bibliotheks-API): schrittweise verschärfen.
disallow_untyped_defs = false
